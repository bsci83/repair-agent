[project]
name = "repair-agent"
version = "0.1.0"
description = "Hand-rolled diagnostic agent for the Detroit Diesel Series 60 — port of ctrl-a-jr's agent loop to a fault-tree walk."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon Ifill", email = "bsc.ifill@gmail.com" }]
dependencies = [
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repair_diag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]